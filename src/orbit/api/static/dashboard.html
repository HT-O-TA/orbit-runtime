<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit 调度器调试面板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #38bdf8; font-size: 28px; margin-bottom: 10px; }
        .header p { color: #94a3b8; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1e293b; border-radius: 12px; padding: 20px; text-align: center; border-left: 4px solid #38bdf8; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #38bdf8; margin-bottom: 5px; }
        .stat-card .label { color: #94a3b8; font-size: 14px; }
        .chart-section { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 30px; }
        .chart-section h3 { color: #f1f5f9; margin-bottom: 15px; font-size: 18px; }
        #chart-container { height: 300px; }
        .logs-section { background: #1e293b; border-radius: 12px; padding: 20px; }
        .logs-section h3 { color: #f1f5f9; margin-bottom: 15px; font-size: 18px; }
        .logs-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .logs-table th, .logs-table td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        .logs-table th { background: #334155; color: #cbd5e1; font-weight: 600; }
        .logs-table td { color: #e2e8f0; }
        .status-success { color: #22c55e; }
        .status-failed { color: #ef4444; }
        .status-compensated { color: #f59e0b; }
        .refresh-btn { display: block; margin: 20px auto; padding: 10px 30px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: 600; }
        .refresh-btn:hover { background: #0ea5e9; }
        .auto-refresh { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚀 Orbit 调度器调试面板</h1>
        <p>实时监控智能调度决策与执行情况</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="value" id="stat-total">0</div>
            <div class="label">总任务数</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-success">0%</div>
            <div class="label">成功率</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-error">0%</div>
            <div class="label">预估误差率</div>
        </div>
        <div class="stat-card">
            <div class="value" id="stat-speculation">0%</div>
            <div class="label">投机命中率</div>
        </div>
    </div>

    <div class="chart-section">
        <h3>📊 Token 预估 vs 实际对比（最近 10 次）</h3>
        <div id="chart-container"></div>
    </div>

    <div class="logs-section">
        <h3>📋 调度决策日志（最近 20 条）</h3>
        <div class="auto-refresh">自动刷新: <span id="auto-refresh-status">开启</span></div>
        <table class="logs-table">
            <thead>
                <tr>
                    <th>时间</th>
                    <th>任务ID</th>
                    <th>子任务</th>
                    <th>Agent</th>
                    <th>预估Token</th>
                    <th>实际Token</th>
                    <th>投机</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody id="logs-body"></tbody>
        </table>
    </div>

    <button class="refresh-btn" onclick="loadData()">🔄 手动刷新</button>

    <script>
        let chart = null;
        let refreshInterval = null;

        function initChart() {
            chart = echarts.init(document.getElementById('chart-container'));
            chart.setOption({
                tooltip: { trigger: 'axis' },
                legend: { data: ['预估 Token', '实际 Token'], top: 10 },
                grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'category', data: [], axisLabel: { color: '#94a3b8', rotate: 45 } },
                yAxis: { type: 'value', axisLabel: { color: '#94a3b8' } },
                series: [
                    { name: '预估 Token', type: 'bar', data: [], itemStyle: { color: '#38bdf8' } },
                    { name: '实际 Token', type: 'bar', data: [], itemStyle: { color: '#22c55e' } },
                ],
                backgroundColor: 'transparent'
            });
        }

        async function loadData() {
            try {
                const statsResp = await fetch('/api/scheduler/stats');
                const stats = await statsResp.json();
                updateStats(stats);

                const logsResp = await fetch('/api/scheduler/logs?limit=20');
                const logs = await logsResp.json();
                updateLogs(logs);
                updateChart(logs);
            } catch (e) {
                console.error('加载数据失败:', e);
            }
        }

        function updateStats(stats) {
            document.getElementById('stat-total').textContent = stats.total_tasks;
            document.getElementById('stat-success').textContent = (stats.success_rate * 100).toFixed(1) + '%';
            document.getElementById('stat-error').textContent = (stats.avg_estimation_error * 100).toFixed(1) + '%';
            document.getElementById('stat-speculation').textContent = (stats.speculation_hit_rate * 100).toFixed(1) + '%';
        }

        function updateLogs(logs) {
            const tbody = document.getElementById('logs-body');
            tbody.innerHTML = logs.map(log => `
                <tr>
                    <td>${new Date(log.timestamp).toLocaleString('zh-CN')}</td>
                    <td>${log.task_id.slice(-8)}</td>
                    <td>${log.subtask_id}</td>
                    <td>${log.agent_type}</td>
                    <td>${log.estimated_tokens}</td>
                    <td>${log.actual_tokens}</td>
                    <td>${log.speculation_triggered ? '是' : '-'}</td>
                    <td><span class="status-${log.status}">${log.status === 'success' ? '成功' : log.status === 'failed' ? '失败' : '补偿'}</span></td>
                </tr>
            `).join('');
        }

        function updateChart(logs) {
            if (!chart) return;
            const recentLogs = logs.slice(-10);
            const xData = recentLogs.map(log => log.subtask_id);
            const estimatedData = recentLogs.map(log => log.estimated_tokens);
            const actualData = recentLogs.map(log => log.actual_tokens);
            
            chart.setOption({
                xAxis: { data: xData },
                series: [
                    { data: estimatedData },
                    { data: actualData }
                ]
            });
        }

        window.addEventListener('load', () => {
            initChart();
            loadData();
            refreshInterval = setInterval(loadData, 5000);
        });

        window.addEventListener('resize', () => {
            if (chart) chart.resize();
        });
    </script>
</body>
</html>
